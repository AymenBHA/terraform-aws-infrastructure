---
- name: Install nginx
  dnf:
    name: nginx
    state: present

- name: Deploy nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/devspace.conf
  notify: Restart nginx

- name: Start nginx
  service:
    name: nginx
    state: started
    enabled: yes

- name: Deploy website
  template:
    src: index.html.j2
    dest: "{{ web_root }}/index.html"
    owner: root
    group: root
    mode: '0644'
